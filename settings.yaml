data_path: ./data/raw/beir/
embedding_path: ./data/processed/embeddings/
embedding_cache_path: ./data/processed/embeddings/.cache/
reference_path: ./data/processed/references/
mapping_path: ./data/processed/mappings/
mapping_param_path: ./output/mapping_models/
mapping_embedding_path: ./output/mapping_embeddings/
cluster_path: ./data/processed/clusters/

wandb_project: vector-merge
verbose: false

mapping_config:
  device: auto
  batch_size: 32
  verbose: false
  save_param: true
  save_embedding: true
  la2m_config:
    num_clusters: 50
    cluster_method: la2m-cluster
    d_prime: 10
    pca_mapping: true
    pca_dim: 14
    use_norm: false
  nonlinear_config:
    num_layers: 3
    batch_size: 32
    learning_rate: 0.001
    num_epochs: 100
    hidden_dim: 512
    dropout_rate: 0.1
    loss_type: mse
  procrustes_config:
    approximate: false
    q: 1500
    with_rotation: true
    with_scaling: true
    use_pca: false
    reduced_dim: 0
    procrustes_pca_type: none
    use_norm: true
  cca_config:
    n_components: 10
    scale: true
    max_iter: 500
    tol: 0.000001
    copy: true
  gromov_wasserstein_config:
    loss_fun: square_loss
    max_iter: 100
    tol: 0.000000001
    verbose: false
    log: false
    armijo: false
    epsilon: 0.1
    symmetric: true
    G0: uniform

clustering_config:
  clustering_method: la2m-cluster
  device: auto
  verbose: false
  la2m_config:
    d_prime: 10
  kmeans_config:
    n_clusters: 10
    max_iter: 300
    tol: 0.0001
    random_state: 42
  compute_metrics: true

embedding_models:
  model: mistral
  dataset: scifact
  type_: corpus
  mistral_config:
    model_name: mistral-embed
    batch_size: 32
    device: cpu
    max_tokens: 8192
    sleep_time: 2
  openai_config:
    model_name: text-embedding-3-small
    batch_size: 16
    device: cpu
    max_tokens: 8192
    sleep_time: 2
  nv_embed_config:
    model_name: nv-embed
    batch_size: 32
    device: cuda
    model_path: ~/.cache/embedding_models/nv-embed/
    max_tokens: 8192
  gte_config:
    model_name: Alibaba-NLP/gte-Qwen2-7B-instruct
    batch_size: 32
    device: cuda
    model_path: ~/.cache/embedding_models/gte/
    max_tokens: 8192
  fast_text_config:
    model_name: fast-text
    batch_size: 64
    device: cpu
    model_path: ~/.cache/embedding_models/fast-text/
  word2vec_config:
    model_name: word2vec
    batch_size: 64
    device: cpu
    model_path: ~/.cache/embedding_models/word2vec/
  glove_config:
    model_name: glove
    batch_size: 64
    device: cpu
    model_path: ~/.cache/embedding_models/glove.6B/
