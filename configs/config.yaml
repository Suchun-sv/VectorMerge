# VectorMerge Configuration File
# This file contains default settings for VectorMerge

# ==================== Paths ====================
data_path: "./data/raw/beir/"
embedding_path: "./data/processed/embeddings/"
reference_path: "./output/references/"
mapping_path: "./output/mappings/"

# ==================== Model Settings ====================
model_1: "bert-base-uncased"
model_2: "roberta-base"
dataset: "scifact"

# ==================== CLI Default Settings ====================
default_model: "mistral"
default_dataset: "scifact"
default_type: "all"
default_batch_size: 32
default_device: "auto"

# ==================== Algorithm Settings ====================
default_mapping_method: "procrustes"  # "procrustes", "nonlinear", "ours"
default_reference_strategy: "ours"    # "ours", "random", "hierarchical_kmeans", "fps"
default_num_clusters: 50
default_d0_ratio: 0.33

# ==================== Evaluation Settings ====================
default_k_list: [10, 100, 1000]
default_metrics: ["recall", "ndcg", "map"]


# ==================== Advanced Settings ====================
verbose: false
use_cache: true
force_download: false

# ==================== Embedding Models Configuration ====================
embedding_models:
  mistral:
    model_name: mistral-embed
    batch_size: 32
    device: cpu
    max_tokens: 8192
    sleep_time: 2

  openai:
    model_name: text-embedding-3-small
    batch_size: 16
    device: cpu
    
  nv-embed:
    model_name: nv-embed
    batch_size: 32
    device: cuda
    model_path: "~/.cache/embedding_models/nv-embed/"
    max_tokens: 8192
    
  gte:
    model_name: Alibaba-NLP/gte-Qwen2-7B-instruct
    batch_size: 32
    device: cuda
    model_path: "~/.cache/embedding_models/gte/"
    max_tokens: 8192
    
  fast-text:
    model_name: fast-text
    batch_size: 64
    device: cpu
    model_path: "~/.cache/embedding_models/fast-text/"
    
  word2vec:
    model_name: word2vec
    batch_size: 64
    device: cpu
    
  glove:
    model_name: glove
    batch_size: 64
    device: cpu
    dim: 300
    model_path: "~/.cache/embedding_models/glove.6B/"

# ======================================================
