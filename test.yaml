  clustering_method: kmeans
  compute_metrics: true
  device: auto
  kmeans_config: !!python/object:vectormerge.clustering.base.KMeansConfig
    max_iter: 300
    n_clusters: 10
    random_state: 42
    tol: 0.0001
  la2m_config: !!python/object:vectormerge.clustering.base.LA2MClusteringConfig
    d_prime: 10
  verbose: false
data_path: ./data/raw/beir/
dataset: scifact
