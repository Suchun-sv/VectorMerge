default_d0_ratio: 0.33
default_dataset: scifact
default_device: auto
default_k_list:
- 10
- 100
- 1000
default_mapping_method: procrustes
default_metrics:
- recall
- ndcg
- map
default_model: mistral
default_num_clusters: 50
default_reference_strategy: ours
default_type: all
