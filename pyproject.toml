[project]
name = "vectormerge"
version = "0.1.0"
description = "A modern library for embedding evaluation and vector space mapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tqdm>=4.67.1",
    "torch>=2.4.1",
    "beir>=2.0.0",
    "faiss-cpu>=1.8.0",
    "pybind11>=2.13.6",
    "fasttext>=0.9.3",
    "openai>=1.57.0",
    "einops>=0.8.0",
    "transformers>=4.43.4",
    "dvc>=3.42.0",
    "dvc-s3>=3.2.0",
    "numpy>=1.24.4",
    "wandb>=0.19.0",
    "pytrec-eval>=0.5",
    "gensim>=4.3.3",
    "mistralai>=1.2.5",
    "loguru>=0.7.2",
    "flagembedding>=1.3.3",
    "typer>=0.16.0",
    "dotenv>=0.9.9",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "umap>=0.1.1",
    "pot>=0.9.0",
    "dacite>=1.9.2",
    "matplotlib>=3.10.3",
    "seaborn>=0.13.2",
    "sphinx>=8.1.3",
    "furo>=2024.8.6",
    "jasminetool",
]

[project.scripts]
vectormerge = "vectormerge.cli:app"

[tool.uv]
package = true

[tool.uv.sources]
jasminetool = { git = "ssh://git@github.com/Suchun-sv/JasmineTool.git", rev = "main" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
