# VectorMerge Global Configuration Example
# This file should be placed at ~/.vectormerge/config.yaml
# 
# Configuration Priority:
# 1. CLI parameters (highest priority)
# 2. Project configuration file (--config option)
# 3. Global configuration file (this file)
# 4. Built-in defaults (lowest priority)

# ==================== Default Paths ====================
# Set your preferred default paths for data and outputs
default_data_path: "./data/raw/beir/"
default_embedding_path: "./data/processed/embeddings/"
default_reference_path: "./data/processed/references/"
default_mapping_path: "./data/processed/mappings/"
default_output_path: "./results/"

# ==================== Model Settings ====================
# Default models and computation settings
default_model_1: "bert-base-uncased"
default_model_2: "roberta-base"
default_dataset: "scifact"
default_batch_size: 32
default_device: "auto"  # "auto", "cpu", "cuda"

# ==================== Algorithm Settings ====================
# Default algorithm configurations
default_mapping_method: "procrustes"  # "procrustes", "nonlinear", "ours"
default_reference_strategy: "ours"    # "ours", "random", "hierarchical_kmeans", "fps"
default_num_clusters: 50
default_d0_ratio: 0.33

# ==================== Evaluation Settings ====================
# Default evaluation metrics and parameters
default_k_list: [10, 100, 1000]
default_metrics: ["recall", "ndcg", "map"]

# ==================== API Keys ====================
# Store your API keys for external services
# Warning: Keep this file secure and don't commit it to version control
openai_api_key: null  # Set to your OpenAI API key
mistral_api_key: null # Set to your Mistral API key

# ==================== Advanced Settings ====================
# Advanced behavior settings
force_download: false  # Always re-download datasets
verbose: false         # Enable verbose logging by default
use_cache: true        # Use caching for embeddings and computations

# ==================== Usage Examples ====================
# 
# 1. Set your preferred data directory:
#    vectormerge config set default_data_path "/path/to/your/data/"
# 
# 2. Configure your default models:
#    vectormerge config set default_model_1 "sentence-transformers/all-MiniLM-L6-v2"
#    vectormerge config set default_model_2 "sentence-transformers/all-mpnet-base-v2"
# 
# 3. Set API keys:
#    vectormerge config set openai_api_key "your-api-key-here"
# 
# 4. Configure batch size for your hardware:
#    vectormerge config set default_batch_size 64
# 
# 5. View current configuration:
#    vectormerge config show
# 
# 6. Edit this file directly:
#    vectormerge config edit
#    
# 7. Initialize this file with defaults:
#    vectormerge config init 